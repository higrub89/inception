; WordPress PHP-FPM Pool Configuration — Inception (42 Madrid)
; Overrides the default www pool to listen on TCP port 9000
; instead of a UNIX socket, allowing NGINX to connect via Docker network.

[www]
user = www-data
group = www-data

; Listen on TCP port 9000 (required for cross-container communication)
listen = 9000
listen.owner = www-data
listen.group = www-data

; Process manager: dynamic for balanced resource usage
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Clear environment for security
clear_env = no
